<title>Kiwi Notes</title>
<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; height: 100%; background: #101014; overflow: hidden; }
  body { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Helvetica Neue", sans-serif; }

  /* O palco: 1024 px lógicos (as coordenadas do ícone), escalado para a janela pelo script. */
  #fit { position: absolute; left: 50%; top: 50%; width: 1024px; height: 1024px; margin: -512px 0 0 -512px; transform-origin: 50% 50%; }
  #stage { position: relative; width: 1024px; height: 1024px; border-radius: 224px; overflow: hidden; isolation: isolate; will-change: opacity; }
  .L { position: absolute; left: 0; top: 0; width: 1024px; height: 1024px; will-change: transform, opacity; }

  /* 1. A base preta e a borda desenhada. */
  #base { position: absolute; inset: 0; background: #000; opacity: 0; }
  .play #base { animation: fade .25s ease-out both; }
  #outline { position: absolute; left: 252px; top: 280px; width: 520px; height: 320px; }
  #outline i { position: absolute; display: block; opacity: 0; will-change: transform, opacity; }
  #outline i.h, #outline i.v { background: rgba(255, 255, 255, .9); }
  #outline i.c { width: 52px; height: 52px; box-sizing: border-box; border: 0 solid rgba(255, 255, 255, .9); }

  /* O prisma: cada camada (as 4 da espessura e a face, das 3 lâminas) tem a transformação 3D inteira, calculada da
     linha do tempo pelo script. Sem preserve-3d: a ordem de pintura é fixa (de trás para a frente) e cada camada é
     uma textura que só muda de transform na GPU. */
  #scene { position: absolute; inset: 0; transform-origin: 512px 470px; will-change: transform, opacity; }
  .ly { position: absolute; left: 252px; top: 280px; width: 520px; height: 320px; border-radius: 52px; box-sizing: border-box; will-change: transform, opacity; }
  .side { background: linear-gradient(to bottom, #123a52 0%, #2a2160 40%, #4a1c48 70%, #4a3018 100%); opacity: 0; }
  .side.k4 { border: 2px solid rgba(255, 255, 255, .7); }
  .face {
    background: linear-gradient(155deg, #26304a 0%, #0b0d14 38%, #0b0d14 72%, #1d2340 100%);
    border: 3px solid rgba(255, 255, 255, .9);
    overflow: hidden;
    opacity: 0;
  }
  .shine { position: absolute; left: 46px; top: 12px; width: 170px; height: 24px; border-radius: 40px / 14px; border-top: 3px solid rgba(255, 255, 255, .55); box-sizing: border-box; }
  /* O arco-íris: uma faixa larga dentro da face, que anda na diagonal. */
  .band {
    position: absolute; left: 50%; top: 50%; width: 1400px; height: 230px; margin: -115px 0 0 -700px; opacity: 0;
    background: linear-gradient(to bottom, rgba(255, 95, 191, 0) 0%, rgba(255, 95, 191, .85) 18%, rgba(255, 165, 61, .85) 31%, rgba(255, 242, 122, .85) 44%,
      rgba(92, 255, 176, .8) 56%, rgba(69, 201, 255, .85) 68%, rgba(123, 97, 255, .85) 80%, rgba(255, 255, 255, .5) 88%, rgba(255, 255, 255, 0) 100%);
    will-change: transform, opacity;
  }
  #title {
    position: absolute; left: 0; right: 0; top: 404px; text-align: center; font-size: 76px; font-weight: 600; letter-spacing: -.01em;
    color: rgba(255, 255, 255, .96); opacity: 0; will-change: transform, opacity;
  }

  /* 5. O liquid glass e a bola preta (o círculo do começo do gato, em 0,55 do tamanho). */
  #orb { position: absolute; left: 320px; top: 234.4px; width: 384px; height: 384px; opacity: 0; will-change: transform, opacity; }
  #orb > b { position: absolute; inset: 0; border-radius: 50%; }
  #ball { background: linear-gradient(to bottom, #0a3b48 0%, #083340 4%, #021019 19%, #000204 40%, #000 94%); }
  #glass { will-change: opacity; }
  #glass::before {
    content: ""; position: absolute; inset: 0; border-radius: 50%; box-sizing: border-box; border: 6px solid rgba(255, 255, 255, .88);
    background: radial-gradient(circle at 34% 28%, rgba(120, 170, 230, .5) 0%, rgba(30, 40, 70, .6) 26%, rgba(11, 13, 20, .96) 58%, rgba(36, 30, 90, .95) 100%);
  }
  #glass::after {
    content: ""; position: absolute; inset: 14px; border-radius: 50%;
    background: conic-gradient(from 200deg, #ff5fbf, #ffa53d, #fff27a, #5cffb0, #45c9ff, #7b61ff, #ff5fbf);
    -webkit-mask: radial-gradient(closest-side, transparent 84%, #000 90%, #000 97%, transparent 100%);
    mask: radial-gradient(closest-side, transparent 84%, #000 90%, #000 97%, transparent 100%);
    opacity: .75;
  }
  #glass i { position: absolute; left: 70px; top: 46px; width: 130px; height: 70px; border-radius: 50%; border-top: 7px solid rgba(255, 255, 255, .8); transform: rotate(-24deg); }

  /* 6. O gato (T3720): as camadas da imagem aprovada, animadas com os beats do roteiro. Os tempos abaixo são em segundos
     a partir da emenda com o prisma (3,7 s); f = frame a 60 fps. O gato está no palco desde o começo, parado e
     invisível: pinta antes, e a passagem só solta as animações. Os estados-base são a pose final (o "Reduzir movimento"
     mostra ela parada); cada animação começa do estado inicial pelo `from`, com `both`. */
  #cat-layer.off { display: none; }
  #cat-layer.paused, #cat-layer.paused * { animation-play-state: paused !important; }
  #cat-settle { transform-origin: 512px 430px; animation: catSettle .3s cubic-bezier(.2, .8, .2, 1) both; }        /* B1 f0–f18 */
  #cat-float { animation: catFloat 4s ease-in-out .3s infinite; }                                                 /* ±12 px, 4 s, de f18 */
  /* B2 f6–f180: a névoa nasce em volta do círculo e se mexe (um balanço de ±6° que desacelera: a luz é a silhueta
     borrada, e um giro inteiro mostraria o buraco dela girando); some quando o corpo chega (f300–f400). */
  #luz-cabeca { opacity: 0; transform-origin: 512px 430px; animation: luzCabeca 6.567s linear .1s both, luzBalanca 6.567s ease-in-out .1s both; }
  /* B3 f96–f156: as orelhas levantam de dentro da cabeça (o clip é o contorno dela), em mola, a direita 16 frames depois. */
  #orelha-esquerda { animation: orelhaEsq .5s cubic-bezier(.34, 1.56, .64, 1) 1.6s both, tremEsq .167s ease-in-out 2.433s; }
  #orelha-direita { animation: orelhaDir .5s cubic-bezier(.34, 1.56, .64, 1) 1.867s both; }
  /* f130–f190: o círculo de vidro vira a cabeça (o #orb some na mesma janela). */
  #cabeca { animation: fade 1s ease-in-out 2.167s both; }
  /* B4 f160–f268: os olhos acordam (a tabela do roteiro), sonolentos e baixinhos; abrem de vez em f248–f268. */
  .olho { animation: olho 1.8s linear 2.667s both; }
  #olhos { animation: olhosSobem .333s cubic-bezier(.2, .8, .2, 1) 4.133s both; }
  /* B6 f300–f390: o corpo se forma da névoa, e a luz inteira entra no lugar da luz só da cabeça. */
  #corpo { transform-origin: 512px 560px; animation: corpoIn 1.5s cubic-bezier(.2, .8, .2, 1) 5s both; }
  #luz { animation: fade 1.667s ease-in-out 5s both; }
  /* B7 f350–f400: o aro acende por dentro do topo da cabeça, correndo do ciano à esquerda ao púrpura à direita. */
  #aro {
    -webkit-mask-image: linear-gradient(90deg, #000 0 34%, transparent 66%); mask-image: linear-gradient(90deg, #000 0 34%, transparent 66%);
    -webkit-mask-size: 300% 100%; mask-size: 300% 100%; -webkit-mask-repeat: no-repeat; mask-repeat: no-repeat;
    animation: aroIn .833s ease-out 5.833s both;
  }

  @keyframes catSettle { from { transform: scale(1.03); } to { transform: none; } }
  @keyframes catFloat { 0%, 100% { transform: none; } 25% { transform: translateY(-12px); } 75% { transform: translateY(12px); } }
  @keyframes luzCabeca { 0% { opacity: 0; } 10.7% { opacity: 1; } 74.6% { opacity: 1; } 100% { opacity: 0; } }
  @keyframes luzBalanca {
    0% { transform: rotate(-6deg) scale(1.06); } 10.7% { transform: rotate(6deg) scale(1.02); } 25% { transform: rotate(-4deg); }
    44.2% { transform: rotate(2deg); } 70% { transform: rotate(-1deg); } 100% { transform: none; }
  }
  @keyframes orelhaEsq { from { opacity: 0; transform: rotate(-75deg) scale(.6); } 15% { opacity: 1; } to { transform: none; } }
  @keyframes orelhaDir { from { opacity: 0; transform: rotate(75deg) scale(.6); } 15% { opacity: 1; } to { transform: none; } }
  @keyframes tremEsq { 50% { transform: rotate(-4deg); } }
  @keyframes olho {
    0% { transform: scaleY(0); } 2.8% { transform: scaleY(.06); } 19.4% { transform: scaleY(.22); } 33.3% { transform: scaleY(.22); }
    40.7% { transform: scaleY(.04); } 48.1% { transform: scaleY(.04); } 63% { transform: scaleY(.45); } 68.5% { transform: scaleY(.45); }
    73.1% { transform: scaleY(.05); } 77.8% { transform: scaleY(.45); } 81.5% { transform: scaleY(.45); } 94.4% { transform: scaleY(1.04); } 100% { transform: none; }
  }
  @keyframes olhosSobem { from { transform: translateY(8px) scale(.8); } to { transform: none; } }
  @keyframes corpoIn { from { opacity: 0; transform: translateY(40px) scale(.96); } to { opacity: 1; transform: none; } }
  @keyframes aroIn { from { opacity: 0; -webkit-mask-position: 100% 0; mask-position: 100% 0; } to { opacity: 1; -webkit-mask-position: 0 0; mask-position: 0 0; } }

  /* O fim: tudo some (no app, a janela fecha e o hub aparece). */
  #stage.out { animation: fadeOut .35s ease-in both; }

  #again {
    position: fixed; right: 16px; bottom: 16px; font: 500 14px/1 -apple-system, sans-serif; padding: 10px 14px; border-radius: 8px;
    border: 1px solid rgba(255, 255, 255, .25); background: rgba(255, 255, 255, .08); color: #fff; cursor: pointer; opacity: 0; pointer-events: none;
    transition: opacity .3s;
  }
  body.done #again { opacity: 1; pointer-events: auto; }

  /* --------------------------------------------------------------- a linha do tempo */
  .play #scene { animation: sceneOut .28s cubic-bezier(.5, 0, .75, 0) 2.92s both; }
  .play .face { animation: fade .3s ease-out .8s both; }
  .play .side { animation: fade .25s ease-out 1.6s both; }
  .play .ly.s1, .play .ly.s2 { animation: fade .15s linear 2.0s both; }
  .play .s0 .band { animation: sweep .7s cubic-bezier(.45, 0, .55, 1) 1.0s both, sweep2 .7s cubic-bezier(.45, 0, .55, 1) 2.2s; }
  .play .s1 .band { animation: sweep2 .7s cubic-bezier(.45, 0, .55, 1) 2.28s both; }
  .play .s2 .band { animation: sweep2 .7s cubic-bezier(.45, 0, .55, 1) 2.36s both; }
  .play #title { animation: titleIn .4s cubic-bezier(.2, .8, .2, 1) .85s both, titleOut .22s ease-in 1.45s forwards; }
  .play #orb { animation: orbIn .75s cubic-bezier(.2, .8, .2, 1) 3.0s both; }
  .play #glass { animation: fadeOut .35s ease-in-out 3.4s both; }
  .play #orb.grow { animation: orbGrow .9s cubic-bezier(.2, .8, .2, 1) both, fadeOut 1s ease-in-out 2.167s forwards; }

  @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
  @keyframes fadeOut { from { opacity: 1; } to { opacity: 0; } }
  @keyframes edgeX { from { opacity: 1; transform: scaleX(0); } to { opacity: 1; transform: scaleX(1); } }
  @keyframes edgeY { from { opacity: 1; transform: scaleY(0); } to { opacity: 1; transform: scaleY(1); } }
  @keyframes outlineOut { to { opacity: 0; } }
  @keyframes titleIn { from { opacity: 0; transform: translateY(14px) scale(.96); } to { opacity: 1; transform: none; } }
  @keyframes titleOut { from { opacity: 1; transform: none; } to { opacity: 0; transform: translateY(-10px) scale(.98); } }
  @keyframes sweep { 0% { opacity: 0; transform: rotate(-32deg) translateY(-470px); } 18%, 82% { opacity: 1; } 100% { opacity: 0; transform: rotate(-32deg) translateY(470px); } }
  @keyframes sweep2 { 0% { opacity: 0; transform: rotate(-32deg) translateY(-470px); } 18%, 82% { opacity: 1; } 100% { opacity: 0; transform: rotate(-32deg) translateY(470px); } }
  @keyframes sceneOut { 0% { opacity: 1; transform: none; } 60% { opacity: 1; } 100% { opacity: 0; transform: translateY(-44px) scale(.28); } }
  @keyframes orbIn {
    0% { opacity: 0; transform: scale(.12); }
    30% { opacity: 1; transform: scale(.63, .49); }
    55% { transform: scale(.5, .6); }
    78% { transform: scale(.575, .53); }
    100% { opacity: 1; transform: scale(.55); }
  }
  @keyframes orbGrow { from { opacity: 1; transform: scale(.55); } to { opacity: 1; transform: scale(1.17); } }

  /* Reduzir movimento: o gato pronto, com um fade de 0,5 s. */
  @media (prefers-reduced-motion: reduce) {
    #outline, #scene, #title, #orb { display: none; }
    #cat-layer { display: block; }
    #base { opacity: 1; }
    #stage { animation: fade .5s ease-out both; }
    #stage *, #stage.out { animation: none !important; }
    #luz-cabeca { opacity: 0; }
  }
