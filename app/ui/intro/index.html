<!doctype html>
<!-- A intro do Kiwi Notes (T14851, spec #14766): o markup e o CSS do build do pacote (docs/design/kiwicat-v2/intro), no modo app. O script é o main.ts. Sem a janela de mentira do fim (T16769, spec #16759): a moldura vazia cresce até o hub. -->
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Kiwi Notes</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      display: grid;
      place-items: center;
      background: transparent;
      font-family: -apple-system, BlinkMacSystemFont, "Plus Jakarta Sans", sans-serif;
      user-select: none;
    }
    /* A Aparência (startAppearance) põe o color-scheme do tema no <html>; aqui ele fica normal, senão o WebKit pinta
       o fundo da janela transparente inteira de cinza (T16769). Só o --bg do tema importa à intro. */
    :root { color-scheme: normal !important; }
    #stage {
      /* No lugar que o main.ts calcula: o meio da tela, e depois o retângulo do hub (T16769). */
      position: absolute;
      width: min(76vmin, 320px);
      height: min(76vmin, 320px);
      border-radius: 24%;
      background: #090A0E;
      overflow: hidden;
      box-shadow: 0 28px 80px -20px rgba(0, 0, 0, 0.85), 0 0 0 1px rgba(255, 255, 255, var(--ring, 0.08)) inset;
      cursor: pointer;
      will-change: width, height, border-radius, transform, opacity;
    }
    body.done #stage {
      cursor: default;
    }
    #cat-wrap {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
    }
    #fog-layer {
      position: absolute;
      inset: 0;
      z-index: 1;
      pointer-events: none;
      -webkit-mask-image: radial-gradient(circle at 50% 53%, rgba(0,0,0,1) var(--fog-core, 43%), rgba(0,0,0,0.84) var(--fog-mid, 67%), rgba(0,0,0,0.28) var(--fog-mist, 85%), transparent var(--fog-edge, 96%));
      mask-image: radial-gradient(circle at 50% 53%, rgba(0,0,0,1) var(--fog-core, 43%), rgba(0,0,0,0.84) var(--fog-mid, 67%), rgba(0,0,0,0.28) var(--fog-mist, 85%), transparent var(--fog-edge, 96%));
    }
    #face-layer {
      position: absolute;
      inset: 0;
      z-index: 10;
      pointer-events: none;
    }
    canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
    }
    #sparkle-svg {
      position: relative;
      z-index: 10;
      width: 100%;
      height: 100%;
      display: block;
      overflow: visible;
    }
    #again { display: none; }
  </style>
</head>
<body>
  <div id="stage" role="button" tabindex="0" aria-label="Intro Byte Kiwi Cat — clique para pular">
    <div id="cat-wrap">
      <div id="fog-layer"><canvas id="fog-canvas"></canvas></div>
      <div id="face-layer">
        <canvas id="face-canvas"></canvas>
        <svg id="sparkle-svg" viewBox="0 0 240 240" aria-hidden="true">
          <g id="sparkles" fill="#FFFFFF" opacity="0">
            <path d="M 52 96 L 54.5 103 L 61.5 105.5 L 54.5 108 L 52 115 L 49.5 108 L 42.5 105.5 L 49.5 103 Z" />
            <path d="M 190 66 L 192.5 73 L 199.5 75.5 L 192.5 78 L 190 85 L 187.5 78 L 180.5 75.5 L 187.5 73 Z" />
            <path d="M 196 120 L 197.5 124.5 L 202 126 L 197.5 127.5 L 196 132 L 194.5 127.5 L 190 126 L 194.5 124.5 Z" opacity="0.85" />
          </g>
        </svg>
      </div>
    </div>
  </div>
  

  <script type="module" src="./main.ts"></script>
</body>
</html>
