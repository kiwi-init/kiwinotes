<!doctype html>
<meta charset="utf-8">
<title>Kiwi-cat fantasma</title>
<style>
  body { margin: 0; background: #2a2a30; font: 600 14px -apple-system, Helvetica; color: #ddd; }
  .row { display: flex; gap: 0; }
  .panel { position: relative; width: 400px; height: 500px; }
  .panel img, .panel canvas { width: 400px; height: 500px; display: block; }
  .dark { background: #000; } .light { background: #fff; }
  .cap { height: 26px; display: flex; }
  .cap div { width: 400px; padding: 5px 10px; box-sizing: border-box; }
</style>
<div class="cap"><div>v2 (parada)</div><div>fantasma, escuro</div><div>fantasma, claro</div></div>
<div class="row">
  <div class="panel dark"><img id="v2"></div>
  <div class="panel dark"><canvas id="cd" width="800" height="1000"></canvas></div>
  <div class="panel light"><canvas id="cl" width="800" height="1000"></canvas></div>
</div>
<script>
// T10727: the Kiwi-cat as one ghost field. The v2 silhouette (a traced outline, as a signed distance field) is the
// black core; the black dissolves into a soft halo that comes out of the body itself, with slow noise. The colour at
// the top of the head is the halo changing hue. Below, the body becomes wisps. It floats; the halo breathes with it.
const FS = `#version 300 es
precision highp float;
uniform sampler2D uSdf;
uniform float uTime, uLight;
uniform vec2 uRes;
uniform vec4 uEye0, uEye1; // cx, cy, r, unused (canvas units)
out vec4 outColor;

float hash(vec3 p) { p = fract(p * 0.1031); p += dot(p, p.yzx + 33.33); return fract((p.x + p.y) * p.z); }
float noise(vec3 p) {
  vec3 i = floor(p), f = fract(p); vec3 u = f * f * (3.0 - 2.0 * f);
  float a = hash(i), b = hash(i + vec3(1,0,0)), c = hash(i + vec3(0,1,0)), d = hash(i + vec3(1,1,0));
  float e = hash(i + vec3(0,0,1)), g = hash(i + vec3(1,0,1)), h = hash(i + vec3(0,1,1)), k = hash(i + vec3(1,1,1));
  return mix(mix(mix(a,b,u.x), mix(c,d,u.x), u.y), mix(mix(e,g,u.x), mix(h,k,u.x), u.y), u.z);
}
float fbm(vec3 p) {
  float s = 0.0, a = 0.5;
  for (int i = 0; i < 4; i++) { s += a * noise(p); p = p * 2.03 + vec3(11.7, 3.1, 7.9); a *= 0.5; }
  return s;
}
// the outline's signed distance, canvas units (negative inside)
float fbm2(vec3 p) { return 0.62 * noise(p) + 0.38 * noise(p * 2.03 + vec3(11.7, 3.1, 7.9)); }
float sdf(vec2 q) { return texture(uSdf, q / vec2(2048.0, 2560.0)).r; }
float sdfSoft(vec2 q) { return texture(uSdf, q / vec2(2048.0, 2560.0)).g; }

const float TAU = 6.28318530718;
uniform float uPeriod, uLift, uTailLag;

float bob(float y, float t) {
  // the tail lags behind the head
  float lag = uTailLag * smoothstep(1300.0, 2200.0, y);
  return uLift * sin(TAU * t / uPeriod - lag);
}

void main() {
  vec2 p = vec2(gl_FragCoord.x, uRes.y - gl_FragCoord.y) / uRes * vec2(2048.0, 2560.0);
  float t = uTime;
  vec2 q = p - vec2(0.0, bob(p.y, t));
  float low = smoothstep(1500.0, 2150.0, q.y);            // 0 at the head, 1 at the tail
  // slow, smooth noise (two octaves: no grain)
  float n1 = fbm2(vec3(q * 0.0035, t * 0.10));
  vec2 w = vec2(q.x + 70.0 * sin(q.y * 0.0035 + t * 0.55), q.y);
  float n2 = fbm2(vec3(w.x * 0.0030, w.y * 0.0020 - t * 0.14, t * 0.05));
  float d0 = sdf(q) + (n1 - 0.5) * mix(14.0, 80.0, low);
  // wisps that sink: only the core's lower edge frays; the halo keeps the whole shape (no holes in the ring)
  float d = d0 + (10.0 + 70.0 * smoothstep(0.30, 0.80, n2)) * smoothstep(1750.0, 2150.0, q.y);
  // the core: dense black with a soft edge all the way round (about 2-3% of the width), wider toward the tail
  float soft = mix(44.0, 150.0, low);
  float core = 1.0 - smoothstep(-soft, soft, d);
  float breath = 0.88 + 0.12 * sin(TAU * t / uPeriod + 0.6);
  // the halo: a short glow from inside the edge (Bevel) and the wide lavender ring of v2, stronger below
  float ds = sdfSoft(q) + (n1 - 0.5) * mix(14.0, 80.0, low);
  float glow = 0.45 * exp(-max(d0 + 20.0, 0.0) / 100.0);
  float ring = exp(-pow((ds - 150.0) / 170.0, 2.0)) * (0.16 + 0.74 * smoothstep(1350.0, 2150.0, q.y));
  // a density floor near the core, all the way round (also in the V and on the left of the head): no gaps
  float floorD = 0.44 * exp(-max(ds, 0.0) / 280.0) * (1.0 - smoothstep(180.0, 420.0, ds));   // near the core only
  float halo = max(glow + 0.85 * ring, floorD) * breath * (0.92 + 0.16 * (n1 - 0.5));
  halo *= smoothstep(0.0, 340.0, min(min(p.x, 2048.0 - p.x), min(p.y, 2560.0 - p.y)));   // zero at the box's edge
  vec3 mist = vec3(0.72, 0.68, 0.82);                        // the v2 lavender grey
  float haloA = clamp(halo, 0.0, 1.0);
  // the colour: an arc inside the head along the skull, from the left ear down to the left cheek, fading to the
  // right; it is the halo changing hue there (soft across, no edge), as in v2
  vec2 c0 = vec2(1104.0, 1304.0); vec2 r0 = q - c0;
  float rad = length(r0), th = degrees(atan(r0.y, r0.x)); th = th < 0.0 ? th : th - 360.0;   // -70 right end .. -200 cheek
  // across the top of the head: from the left cheek, over the crown, to just right of the centre
  float along = smoothstep(-28.0, -70.0, th) * (1.0 - smoothstep(-188.0, -206.0, th));
  float across = (rad - 405.0) / 66.0;                         // + outer .. - inner
  float band = exp(-0.5 * across * across) * along * (0.92 + 0.16 * (n1 - 0.5));
  float inside = 1.0 - smoothstep(-30.0, 70.0, d0);          // in the head, fading out through the edge into the halo
  float k = clamp(across * 0.5 + 0.5, 0.0, 1.0);             // 0 inner .. 1 outer
  float lowEnd = smoothstep(-150.0, -200.0, th);              // toward the cheek it turns pink
  vec3 prism = k > 0.5 ? mix(vec3(0.42, 0.40, 0.95), vec3(0.30, 0.80, 0.94), (k - 0.5) * 2.0)
                       : mix(mix(vec3(0.66, 0.36, 0.86), vec3(0.86, 0.38, 0.70), lowEnd), vec3(0.42, 0.40, 0.95), k * 2.0);
  float arcA = band * inside * 0.95;
  vec3 coreCol = vec3(0.035, 0.035, 0.045);
  // the touch of blue on the right side of the head, as in v2: the halo there turns blue
  float blueW = 0.75 * exp(-dot(q - vec2(1500.0, 1170.0), q - vec2(1500.0, 1170.0)) / (2.0 * 150.0 * 150.0));
  vec3 haloCol = mix(mist, vec3(0.42, 0.66, 0.95), blueW);
  if (uLight > 0.5) {
    // the inverse: a light core, a soft dark halo, the same silhouette; the arc in deeper tones
    coreCol = vec3(0.975, 0.975, 0.985);
    haloCol = mix(vec3(0.30, 0.28, 0.38), vec3(0.14, 0.30, 0.62), blueW);
    haloA *= 0.50;
    prism = prism * 0.62;
    arcA *= 0.8;
  }
  // eyes (in the app they are DOM and float with the head)
  float eyes = 0.0;
  for (int i = 0; i < 2; i++) {
    vec4 E = i == 0 ? uEye0 : uEye1;
    vec2 c = vec2(E.x, E.y + bob(E.y, t));
    eyes = max(eyes, 1.0 - smoothstep(E.z - 1.6, E.z + 1.6, length(p - c)));
  }
  vec3 eyeCol = uLight > 0.5 ? vec3(0.09, 0.09, 0.11) : vec3(1.0);
  // premultiplied: the halo under the core, the eyes on top
  // straight-alpha layers, premultiplied only at the end (mixing premultiplied colours made fringes)
  float a = core + haloA * (1.0 - core);
  vec3 col = (coreCol * core + haloCol * haloA * (1.0 - core)) / max(a, 1e-4);
  // the arc as a layer over the core and the near halo
  float a2 = arcA + a * (1.0 - arcA);
  col = (prism * arcA + col * a * (1.0 - arcA)) / max(a2, 1e-4); a = a2;
  vec3 rgb = col * a;
  rgb = mix(rgb, eyeCol, eyes); a = max(a, eyes);
  outColor = vec4(rgb, a);
}`;
const VS = `#version 300 es
in vec2 pos; void main() { gl_Position = vec4(pos, 0.0, 1.0); }`;

window.PARAMS = { period: 6.5, lift: 64, tailLag: 0.3 };   // about 3 px at 120 px, one slow cycle
function setup(canvas, sdf, light) {
  const gl = canvas.getContext("webgl2", { premultipliedAlpha: true, preserveDrawingBuffer: true, alpha: true });
  const sh = (type, src) => { const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s);
    if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s)); return s; };
  const prog = gl.createProgram(); gl.attachShader(prog, sh(gl.VERTEX_SHADER, VS)); gl.attachShader(prog, sh(gl.FRAGMENT_SHADER, FS));
  gl.linkProgram(prog); if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(prog));
  gl.useProgram(prog);
  const buf = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, buf);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 1,-1, -1,1, 1,1]), gl.STATIC_DRAW);
  const loc = gl.getAttribLocation(prog, "pos"); gl.enableVertexAttribArray(loc); gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);
  const tex = gl.createTexture(); gl.bindTexture(gl.TEXTURE_2D, tex);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RG16F, sdf.w, sdf.h, 0, gl.RG, gl.FLOAT, sdf.data);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  const U = n => gl.getUniformLocation(prog, n);
  return t => {
    gl.viewport(0, 0, canvas.width, canvas.height); gl.clearColor(0, 0, 0, 0); gl.clear(gl.COLOR_BUFFER_BIT);
    gl.uniform1f(U("uTime"), t); gl.uniform1f(U("uLight"), light ? 1 : 0); gl.uniform2f(U("uRes"), canvas.width, canvas.height);
    gl.uniform1f(U("uPeriod"), PARAMS.period); gl.uniform1f(U("uLift"), PARAMS.lift); gl.uniform1f(U("uTailLag"), PARAMS.tailLag);
    gl.uniform4f(U("uEye0"), 802.823, 1279.323, 68.251, 0); gl.uniform4f(U("uEye1"), 1243.342, 1279.308, 67.94, 0);
    gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
  };
}
window.init = (sdfJson, v2url) => {
  const raw = Uint8Array.from(atob(sdfJson.data), c => c.charCodeAt(0));
  const sdf = { w: sdfJson.w, h: sdfJson.h, data: new Float32Array(raw.buffer) };
  document.getElementById("v2").src = v2url;
  const d = setup(document.getElementById("cd"), sdf, false), l = setup(document.getElementById("cl"), sdf, true);
  window.renderAt = t => { d(t); l(t); };
  window.renderAt(0);
};
</script>
