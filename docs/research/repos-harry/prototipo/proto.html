<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kiwi: protótipo por skill (spec #12550)</title>
<style>
/* Comum a todas as propostas: só as fontes locais e o gato, que fica como está (sempre preto, a névoa na cor do agente). */
@font-face { font-family: "Inter"; src: url("assets/Inter.woff2") format("woff2"); font-weight: 100 900; }
@font-face { font-family: "Paper Mono"; src: url("assets/PaperMono.woff2") format("woff2"); font-weight: 100 900; }
@font-face { font-family: "Instrument Sans"; src: url("assets/instrument.woff2") format("woff2"); font-weight: 400 700; }
@font-face { font-family: "Figtree"; src: url("assets/figtree.woff2") format("woff2"); font-weight: 300 900; }
@font-face { font-family: "Plus Jakarta Sans"; src: url("assets/jakarta.woff2") format("woff2"); font-weight: 200 800; }
@font-face { font-family: "Literata"; src: url("assets/literata.woff2") format("woff2"); font-weight: 200 900; }
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; overflow: hidden; }
.app { position: relative; width: 1380px; height: 820px; overflow: hidden; }
.cat { position: absolute; right: 22px; bottom: 26px; width: 92px; height: 108px; pointer-events: none; z-index: 5; }
.cat::before { content: ""; position: absolute; inset: -14px; border-radius: 50%; background: radial-gradient(closest-side, rgb(232 122 60 / 0.55), rgb(232 122 60 / 0) 72%); }
.cat img { position: relative; width: 100%; height: 100%; object-fit: contain; }
.done .box { position: relative; } .done .box::after { content: ""; position: absolute; left: 4.5px; top: 1px; width: 4px; height: 8px; border: solid #fff; border-width: 0 2px 2px 0; transform: rotate(45deg); }
svg.i { width: 16px; height: 16px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
</style>
<link id="skillcss" rel="stylesheet">
</head>
<body>
<div class="app" id="app"></div>
<script>
const qs = new URLSearchParams(location.search);
const skill = qs.get("skill") || "unslop";
const screen = qs.get("screen") || "nota";
const theme = qs.get("theme") || "light";
document.documentElement.dataset.theme = theme;
document.documentElement.dataset.skill = skill;
document.getElementById("skillcss").href = `skills/${skill}.css`;

// As opções que mudam a marcação, uma por skill. O resto é só CSS.
const OPT = {
  unslop:    { dedupe: true,  sep: "", count: "Escuros 29", quotes: "curly", bubble: ["secondary:Ver a proposta", "primary:Aplicar", "quiet:Descartar"], later: true, calloutIcon: "svg" },
  impeccable:{ dedupe: true,  sep: "", count: "Escuros 29", quotes: "curly", bubble: ["primary:Aplicar as 2 mudanças", "secondary:Descartar"], later: false, calloutIcon: "svg", inline: true },
  hallmark:  { dedupe: true,  sep: "", count: "Escuros 29", quotes: "curly", bubble: ["primary:Aplicar", "secondary:Ver a proposta", "quiet:Descartar"], later: false, calloutIcon: "none", fader: true },
  huashu:    { dedupe: true,  sep: "", count: "29 temas escuros", quotes: "curly", bubble: ["secondary:Ver", "primary:Aplicar", "secondary:Descartar"], later: false, calloutIcon: "none", highlight: true },
  uupm:      { dedupe: false, sep: " · ", count: "Escuros · 29", quotes: "straight", bubble: ["secondary:Ver a proposta", "primary:Aplicar", "danger:Descartar"], later: true, calloutIcon: "svg" },
  designmd:  { dedupe: false, sep: "", count: "Escuros 29", quotes: "straight", bubble: ["secondary:Ver a proposta", "primary:Aplicar", "ghost:Descartar"], later: true, calloutIcon: "svg" },
}[skill];

const I = {
  side: '<rect x="3" y="4" width="18" height="16" rx="2"/><path d="M9 4v16"/>',
  chev: '<path d="m6 9 6 6 6-6"/>',
  pen: '<path d="M4 20h4L19 9l-4-4L4 16z"/>',
  search: '<circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/>',
  palette: '<path d="M12 3a9 9 0 1 0 0 18c1.5 0 2-1 2-2s-1-1.5-1-2.5 1-1.5 2-1.5h2a4 4 0 0 0 4-4c0-4.4-4-8-9-8z"/><circle cx="7.5" cy="11" r="1"/><circle cx="10" cy="7" r="1"/><circle cx="15" cy="7.5" r="1"/>',
  mic: '<rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/>',
  file: '<path d="M14 3H6v18h12V7z"/><path d="M14 3v4h4M9 13h6M9 17h6"/>',
  users: '<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0"/><path d="M16 4.5a3.5 3.5 0 0 1 0 7M18 14a5.5 5.5 0 0 1 3.5 6"/>',
  spark: '<path d="M12 3v4M12 17v4M3 12h4M17 12h4M6 6l2.5 2.5M15.5 15.5 18 18M18 6l-2.5 2.5M8.5 15.5 6 18"/>',
  list: '<path d="M9 6h11M9 12h11M9 18h11M4 6h.01M4 12h.01M4 18h.01"/>',
  lock: '<rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/>',
  info: '<circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7.5h.01"/>',
  note: '<path d="M4 5h16v10l-5 5H4z"/><path d="M15 20v-5h5"/>',
  chevr: '<path d="m9 6 6 6-6 6"/>',
};
const ic = (n) => `<svg class="i" viewBox="0 0 24 24" aria-hidden="true">${I[n]}</svg>`;
const q = (s) => OPT.quotes === "curly" ? `“${s}”` : `"${s}"`;

function topbar(withFolder) {
  return `<header class="top">
    ${withFolder ? `<button class="folder">${ic("side")}<span>Projetos / Migração</span>${ic("chev")}</button>` : `<span class="folder-gap"></span>`}
    <nav class="tabs" role="tablist">${["Notas", "Reuniões", "Ditado", "Configurações"].map((t) => `<button class="tab" role="tab" aria-selected="${screen === "aparencia" ? t === "Configurações" : t === "Notas"}">${t}</button>`).join("")}</nav>
    ${withFolder ? `<div class="tools"><button aria-label="Editar">${ic("pen")}</button><button aria-label="Buscar">${ic("search")}</button></div>` : `<span class="folder-gap"></span>`}
  </header>`;
}

function note() {
  const meta = ["editada hoje", `<span class="num">96</span> palavras`];
  const calloutIc = OPT.calloutIcon === "svg" ? ic("note") : OPT.calloutIcon === "glyph" ? "✎" : "";
  const hl = (s) => OPT.highlight ? `<mark>${s}</mark>` : s;
  const ghost = OPT.inline && screen === "balao";
  return `<main class="note">
    <div class="crumb">Projetos <span class="sep">›</span> Migração</div>
    <h1 class="title">Migração</h1>
    <div class="meta"><span>${meta.join(`</span>${OPT.sep ? `<span class="dot">${OPT.sep}</span>` : ""}<span>`)}</span><a class="backlinks">nenhuma nota cita esta</a></div>
    <details class="toc"><summary>Sumário</summary></details>
    <article class="body">
      ${OPT.dedupe ? "" : `<h1>Migração</h1>`}
      <p>A migração do arquivo antigo para o PACS novo, por fases, com a revisão de segurança ${hl("antes de abril")}.</p>
      <h2>Pendências</h2>
      <ul class="tasks">
        <li><span class="box"></span>Pedir o acesso ao bucket</li>
        <li><span class="box"></span>Rever o anonimizador com a Ana</li>
        ${ghost ? `<li class="proposed"><span class="box"></span>Confirmar a janela de manutenção<span class="why">da reunião de 11/11</span></li>` : ""}
        <li class="done"><span class="box"></span>Subir o bastion</li>
      </ul>
      <h2>Notas</h2>
      <p>O arquivo de 2019 é o maior: uns 4 TB, quase tudo tomografia. Começamos por ele, fora do horário de pico.</p>
      ${ghost ? `<p class="proposed">Ana, em 11/11: começar pelo arquivo de 2019. <a>2026-11-11 · Cronograma da migração</a><span class="why">nota nova</span></p>` : ""}
      <table><thead><tr><th>Fase</th><th class="n">Estudos</th><th>Situação</th></tr></thead><tbody>
        <tr><td>2019</td><td class="n">182.400</td><td>em andamento</td></tr>
        <tr><td>2020</td><td class="n">141.150</td><td>na fila</td></tr>
        <tr><td>2021</td><td class="n">98.700</td><td>na fila</td></tr></tbody></table>
      <aside class="callout">${calloutIc ? `<span class="callout-ic">${calloutIc}</span>` : ""}<div><strong>Decisão de 10/11</strong><p>O envio usa STOW em lotes de 500, e o retorno do QIDO confere cada lote.</p></div></aside>
    </article>
  </main>`;
}

function bubble() {
  const text = OPT.inline
    ? `A reunião ${q("2026-11-11 10h00 Zoom")} entra na nota: 2 mudanças, marcadas na margem.`
    : `A proposta da reunião ${q("2026-11-11 10h00 Zoom")} está pronta: a nota ${q("2026-11-11 · Cronograma da migração")} em Migração, e a reunião na nota principal.`;
  const btns = OPT.bubble.map((b) => { const [k, t] = b.split(":"); return `<button class="${k}">${t}</button>`; }).join("");
  return `<div class="bubble" role="dialog"><p>${text}</p><div class="actions">${btns}</div>${OPT.later ? `<a class="later">Depois</a>` : ""}</div>`;
}

const THEMES = [
  ["OLED Black", "#000000", "#8ab4ff"], ["Channels Dark", "#161618", "#8ab4ff"], ["Abyssal Trench", "#0b1a24", "#3fd0b0"],
  ["Basalt Shore", "#1b2224", "#7fd3b8"], ["Cathode Amber", "#1c150c", "#f5b23a"], ["Charcoal Atelier", "#1c1c1c", "#e0613f"],
  ["Cinder Peak", "#1e1817", "#ef5b3b"], ["Cobalt Foundry", "#121a26", "#3b8cf0"], ["Ember Hollow", "#1c1612", "#e88a4a"],
  ["Heliotrope Haze", "#1a1626", "#f06ad0"],
];
function seg(opts, on) { return `<div class="seg">${opts.map((o) => `<button aria-pressed="${o === on}">${o}</button>`).join("")}</div>`; }
function prefs() {
  const items = [["palette", "Aparência"], ["mic", "Ditado"], ["file", "Notas"], ["users", "Reuniões"], ["spark", "Agente"], ["list", "Atividade do agente"], ["lock", "Privacidade"], ["info", "Sobre"]];
  const size = OPT.fader
    ? `<div class="fader" role="slider" aria-valuemin="1" aria-valuemax="5" aria-valuenow="2" aria-valuetext="Padrão"><div class="track"><span class="fill"></span><span class="cap"></span></div><div class="ticks">${["Pequeno", "Padrão", "Grande", "Maior", "Máximo"].map((t, i) => `<span class="${i === 1 ? "on" : ""}">${t}</span>`).join("")}</div></div>`
    : seg(["Pequeno", "Padrão", "Grande", "Maior", "Máximo"], "Padrão");
  return `<div class="prefs">
    <nav class="side">${items.map(([i, t]) => `<a class="item" ${t === "Aparência" ? 'aria-current="page"' : ""}>${ic(i)}<span>${t}</span></a>`).join("")}</nav>
    <section class="pane">
      <h2>Aparência</h2>
      <div class="group">
        <div class="row"><div><div class="label">Modo</div><div class="hint">Sistema segue o claro e o escuro do Mac.</div></div>${seg(["Sistema", "Escuro", "Claro"], theme === "dark" ? "Escuro" : "Claro")}</div>
        <div class="row"><div><div class="label">Tamanho do texto</div></div>${size}</div>
        <div class="row"><div><div class="label">Fonte</div></div>${seg(["Sistema", "Inter", "Lato", "Atkinson"], "Sistema")}</div>
        <div class="row"><div><div class="label">Movimento</div><div class="hint">O Reduzir movimento do macOS também corta as animações.</div></div>${seg(["Completo", "Reduzido"], "Completo")}</div>
        <div class="row themes-head"><div><div class="label">Temas</div></div><input class="search" placeholder="Buscar temas"></div>
        <div class="sub">${OPT.count}</div>
        <div class="grid">${THEMES.map(([n, bg, ac], i) => `<button class="theme" aria-pressed="${i === 0}"><span class="swatch" style="--sw:${bg};--ac:${ac}"><i></i><i></i><i></i><b></b></span><span class="name">${n}</span></button>`).join("")}</div>
      </div>
    </section>
  </div>`;
}

const cat = `<div class="cat"><img src="assets/cat.png" alt=""></div>`;
const app = document.getElementById("app");
app.dataset.screen = screen;
app.innerHTML = screen === "aparencia" ? topbar(false) + prefs() + cat : topbar(true) + note() + (screen === "balao" ? bubble() : "") + cat;
</script>
</body>
</html>
