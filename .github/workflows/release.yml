# O release do Mac do Kiwi Notes (T1074, decisão A do harry em #1303): build, assinatura com o Developer ID da Kiwi
# Init, notarização, staple e o .dmg como Release. Os secrets têm os mesmos nomes do Channels (kiwi-init/channels,
# release-build.yml): MAC_CERT_P12_BASE64, MAC_CERT_PASSWORD, APPLE_API_KEY_P8, APPLE_API_KEY_ID, APPLE_API_ISSUER.
# Nenhum valor passa pelo repo nem pela sala. Os builds dos agentes, no Mac, seguem ad hoc.
#
# - tag v* (com a versão do app/package.json): publica a Release;
# - "Run workflow" à mão: com rehearsal ligado, assina ad hoc e não notariza (ensaio sem as chaves).

name: release

on:
  push:
    tags: ["v*"]
    # Só o job `helper-cache`: guarda na `main` o helper compilado, porque um run de tag só restaura cache do próprio
    # tag ou da `main` (T1686). O GitHub não avalia `paths` num push de tag.
    branches: [main]
    paths: ["native/**", "native-voice/**", "app/scripts/build-helper.ts", "app/scripts/build-voice.ts", ".github/workflows/release.yml"]
  workflow_dispatch:
    inputs:
      rehearsal:
        description: Ensaio (ad hoc, sem notarizar e sem publicar)
        type: boolean
        default: true

# Só leitura no build: o `bun install` roda scripts de dependência, e nada ali deve ter um token que escreve no repo.
# Quem publica é o job `publish`, o único com `contents: write` (revisão #1451).
permissions:
  contents: read

# O tag e o ensaio rodam até o fim. O `helper-cache` (o push na `main`) tem um grupo próprio, que cancela o anterior.
concurrency:
  group: release-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

jobs:
  mac:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    runs-on: macos-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.4

      - name: Install
        run: bun install --frozen-lockfile

      - name: The tag matches the app version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          v=$(bun -e 'console.log(JSON.parse(await Bun.file("package.json").text()).version)')
          # O formato do Channels (spec #13879): vANO.MÊS.N, como v2026.11.1, igual ao app/package.json, como texto
          # (#1480). Não há mais rc: um tag com "-" ou fora do formato não publica nada.
          t=$(bun scripts/update-feed.ts version "$GITHUB_REF_NAME")
          [[ -n "$t" && "$t" == "$v" ]] || { echo "the tag $GITHUB_REF_NAME must be vANO.MÊS.N and match app/package.json ($v)"; exit 1; }

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.hutch
          key: hutch-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('app/hutch-pin.json') }}

      # O Build compilava o helper e o FluidAudio do zero a cada run (7,8 min de ~10, #1682). O helper pronto
      # (app/.helper, ~22 MB) vai para o cache: com os mesmos fontes e o mesmo toolchain, o `swift build` nem roda. O que
      # vai para o cache nunca está assinado: a assinatura é feita na cópia de dentro do .app. O cache do native/.build
      # (~1 GB) saiu: no runner (Swift 6.3.3), mesmo restaurado, o FluidAudio recompilava inteiro (run 41752909679).
      - name: Swift toolchain id
        id: swift
        # O Xcode e o Swift: um Xcode novo com o mesmo Swift também não reaproveita objeto (#1714).
        run: echo "id=$({ xcodebuild -version; swift --version 2>&1 | head -1; } | shasum | cut -c1-12)" >> "$GITHUB_OUTPUT"

      # A mesma chave do job `helper-cache`. Um run de tag só vê o cache do tag e o da `main`, nunca o de um branch.
      - name: Helper cache
        id: helper
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: app/.helper
          key: helper-${{ runner.os }}-${{ runner.arch }}-${{ steps.swift.outputs.id }}-${{ hashFiles('native/Package.swift', 'native/Package.resolved', 'native/Sources/**', 'app/scripts/build-helper.ts') }}

      # A voz do gato (ADR 0014, T26732): o `kiwi-voice` e o metallib do MLX, que só o xcodebuild compila (~5 min do zero).
      # O mesmo caminho do helper: o job `voice-cache` guarda na `main`, o tag restaura, e o que vai ao cache não é assinado.
      - name: Voice cache
        id: voice
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: app/.voice
          key: voice-${{ runner.os }}-${{ runner.arch }}-${{ steps.swift.outputs.id }}-${{ hashFiles('native-voice/Package.swift', 'native-voice/Package.resolved', 'native-voice/Sources/**', 'native-voice/.swiftpm/**', 'app/scripts/build-voice.ts') }}

      - name: Electrobun toolchain
        timeout-minutes: 5
        run: for i in 1 2 3; do bun run prepare:eb && exit 0; echo "electrobun prepare failed ($i of 3)"; [ "$i" -lt 3 ] && sleep 20; done; exit 1

      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version

      # O WebKit do Playwright: o teste do OCR da guarda (push-guard.test.ts) desenha a imagem nele, como no ci.yml.
      - name: Browsers
        run: bunx playwright-core install webkit

      - name: Test
        run: bun test

      # O feed da atualização automática (T1969, ADR 0008): o release no `releases/latest`. Fora de um tag (ensaio), vazio:
      # o app sai sem baseUrl e nunca checa.
      - name: Update feed
        id: feed
        run: |
          echo "url=$(bun scripts/update-feed.ts url "$GITHUB_REF_NAME" "$GITHUB_REPOSITORY")" >> "$GITHUB_OUTPUT"
          echo "version=$(bun scripts/update-feed.ts version "$GITHUB_REF_NAME")" >> "$GITHUB_OUTPUT"

      - name: Build
        env:
          KIWI_HELPER_CACHED: ${{ steps.helper.outputs.cache-hit == 'true' && '1' || '' }}
          KIWI_VOICE_CACHED: ${{ steps.voice.outputs.cache-hit == 'true' && '1' || '' }}
          KIWI_UPDATE_URL: ${{ steps.feed.outputs.url }}
          # A versão do tag (`2026.11.1`): o app compara por ela antes de oferecer uma atualização (T1969).
          KIWI_VERSION: ${{ steps.feed.outputs.version }}
        run: |
          echo "update feed: ${KIWI_UPDATE_URL:-(none)}, version: ${KIWI_VERSION:-(package.json)}"
          bun run build

      - name: Sign, notarize and package
        shell: bash
        env:
          MAC_CERT_P12_BASE64: ${{ secrets.MAC_CERT_P12_BASE64 }}
          MAC_CERT_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          REHEARSAL: ${{ github.event_name == 'workflow_dispatch' && inputs.rehearsal }}
        run: |
          if [ "$REHEARSAL" != true ]; then
            [ -n "$MAC_CERT_P12_BASE64" ] && [ -n "$APPLE_API_KEY_P8" ] || { echo "a release needs the signing and notary secrets (or run it as a rehearsal)"; exit 1; }
            kc="$RUNNER_TEMP/kiwinotes-signing.keychain-db"
            kcpass=$(openssl rand -base64 32)
            security create-keychain -p "$kcpass" "$kc"
            security set-keychain-settings -lut 21600 "$kc"
            security unlock-keychain -p "$kcpass" "$kc"
            printf '%s' "$MAC_CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
            security import "$RUNNER_TEMP/cert.p12" -k "$kc" -P "$MAC_CERT_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security -f pkcs12 \
              || { echo "the certificate didn't import: check MAC_CERT_P12_BASE64 and MAC_CERT_PASSWORD"; exit 1; }
            rm -f "$RUNNER_TEMP/cert.p12"
            # O intermediário Developer ID G2 da Apple (o que assina o certificado do jow), do repo e conferido pelo
            # SHA-256: sem depender da rede. Baixar derrubou o run do tag v0.1.0-rc1 (curl: (6), run 41744305634), e o
            # sistema só tem o G1 (#1699), então ele não pode faltar.
            echo "f16cd3c54c7f83cea4bf1a3e6a0819c8aaa8e4a1528fd144715f350643d2df3a  build-config/DeveloperIDG2CA.cer" | shasum -a 256 -c - \
              || { echo "build-config/DeveloperIDG2CA.cer isn't Apple's Developer ID G2 intermediate"; exit 1; }
            security import build-config/DeveloperIDG2CA.cer -k "$kc" -T /usr/bin/codesign || true
            security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$kcpass" "$kc" > /dev/null
            security list-keychains -d user -s "$kc" $(security list-keychains -d user | tr -d '"')
            ids=$(security find-identity -v -p codesigning "$kc")
            [[ "$ids" == *"Developer ID Application"* ]] \
              || { echo "no Developer ID Application identity in the certificate (export it from My Certificates, with its key)"; exit 1; }
            printf '%s' "$APPLE_API_KEY_P8" > "$RUNNER_TEMP/apple-api-key.p8"
            export EB_SIGN_KEYCHAIN="$kc" APPLE_API_KEY="$RUNNER_TEMP/apple-api-key.p8"
          fi
          unset MAC_CERT_P12_BASE64 MAC_CERT_PASSWORD APPLE_API_KEY_P8
          bun scripts/release.ts artifacts out

      - name: Clean up the keychain and the key
        if: always()
        shell: bash
        run: |
          security delete-keychain "$RUNNER_TEMP/kiwinotes-signing.keychain-db" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/apple-api-key.p8"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ (github.event_name == 'workflow_dispatch' && inputs.rehearsal) && 'rehearsal' || 'release' }}-mac
          retention-days: ${{ (github.event_name == 'workflow_dispatch' && inputs.rehearsal) && 3 || 30 }}
          # O .dmg, e o que o Updater baixa: o mesmo app num .tar.zst e o manifesto (T1969).
          path: |
            app/out/*.dmg
            app/out/*.tar.zst
            app/out/*-update.json
          if-no-files-found: error

  # Compila só o helper e a voz num push na `main` e guarda o app/.helper e o app/.voice no cache da `main`, de onde o
  # run do tag restaura (#1805). Assim o cache que o release assina só nasce de código que já está na main: sem secret, sem `bun install`
  # (nenhum script de dependência roda aqui), sem `pull_request`. Um Mac por vez (spec #29579): um push novo em `native/`
  # cancela o build do anterior, e o novo guarda o cache. Um tag que sai antes dele acabar compila o helper no próprio run.
  helper-cache:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: macos-latest
    # O helper (~8 min do zero) e o MLX da voz (~5 a 10 min do zero).
    timeout-minutes: 45
    permissions:
      contents: read
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.4

      # Igual ao job `mac`: o id do toolchain e a chave precisam bater, senão o tag não acerta.
      - name: Swift toolchain id
        id: swift
        run: echo "id=$({ xcodebuild -version; swift --version 2>&1 | head -1; } | shasum | cut -c1-12)" >> "$GITHUB_OUTPUT"

      - name: Helper cache
        id: helper
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: app/.helper
          key: helper-${{ runner.os }}-${{ runner.arch }}-${{ steps.swift.outputs.id }}-${{ hashFiles('native/Package.swift', 'native/Package.resolved', 'native/Sources/**', 'app/scripts/build-helper.ts') }}

      - name: Build the helper
        if: steps.helper.outputs.cache-hit != 'true'
        run: bun scripts/build-helper.ts

      - name: Voice cache
        id: voice
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: app/.voice
          key: voice-${{ runner.os }}-${{ runner.arch }}-${{ steps.swift.outputs.id }}-${{ hashFiles('native-voice/Package.swift', 'native-voice/Package.resolved', 'native-voice/Sources/**', 'native-voice/.swiftpm/**', 'app/scripts/build-voice.ts') }}

      - name: Build the voice
        if: steps.voice.outputs.cache-hit != 'true'
        run: bun scripts/build-voice.ts

  publish:
    needs: mac
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # O script das notas e o nome do release (spec #13879). Sem o histórico: os commits vêm da API de compare.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: app/scripts

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.4

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-mac
          path: out

      # As notas no formato do Channels (spec #13879): os PRs desde o release anterior (o `v*` mais novo antes deste),
      # um por linha, com o título em negrito e o link, e o rodapé de onde baixar e como conferir.
      - name: Release notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          prev=$(gh release list --repo "$GITHUB_REPOSITORY" --exclude-drafts --limit 100 --json tagName,createdAt \
            --jq "[.[] | select(.tagName | startswith(\"v\")) | select(.tagName != \"$GITHUB_REF_NAME\")] | sort_by(.createdAt) | last | .tagName // empty")
          # O primeiro release do repo (o repo novo de um commit só, #16505): sem anterior, as notas são a seção do CHANGELOG.
          if [[ -z "$prev" ]]; then
            bun app/scripts/release-notes.ts "$GITHUB_REPOSITORY" "$GITHUB_REF_NAME" --first > out/release-notes.md
            cat out/release-notes.md
            exit 0
          fi
          # O anterior tem de estar no histórico deste tag (revisão do #552): depois de uma reescrita do histórico, um tag
          # velho que não foi reescrito junto daria "diverged", e as notas listariam o histórico inteiro.
          status=$(gh api "repos/$GITHUB_REPOSITORY/compare/$prev...$GITHUB_REF_NAME" --jq .status)
          [[ "$status" == "ahead" ]] || { echo "the previous release $prev isn't behind $GITHUB_REF_NAME (compare: $status)"; exit 1; }
          gh api "repos/$GITHUB_REPOSITORY/compare/$prev...$GITHUB_REF_NAME" --paginate --jq '.commits[].commit.message | split("\n")[0]' \
            | bun app/scripts/release-notes.ts "$GITHUB_REPOSITORY" "$GITHUB_REF_NAME" "$prev" > out/release-notes.md
          cat out/release-notes.md

      - name: Publish the Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          dmg=(out/*.dmg); tar=(out/*.tar.zst); manifest=(out/*-update.json)
          [[ ${#dmg[@]} == 1 && ${#tar[@]} == 1 && ${#manifest[@]} == 1 ]] || { echo "expected 1 dmg, 1 tar.zst and 1 update.json in out/"; ls -la out; exit 1; }
          # "Kiwi Notes 2026.11.1", e o "latest": é dali que o app instalado lê o feed.
          name=$(bun app/scripts/update-feed.ts name "$GITHUB_REF_NAME")
          gh release create "$GITHUB_REF_NAME" "${dmg[@]}" "${tar[@]}" "${manifest[@]}" --repo "$GITHUB_REPOSITORY" --title "$name" --notes-file out/release-notes.md --latest

      # O feed antigo das rc (T1969): as rc instaladas, até a rc19, leem dele. Sobrescrito a cada release, para quem está
      # numa rc receber a versão nova; daí em diante, o app lê o `latest` (spec #13879). O tar sobe antes do manifesto:
      # quem lê o manifesto novo já acha o tar.
      - name: Update the old rc feed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if ! gh release view updates-rc --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release create updates-rc --repo "$GITHUB_REPOSITORY" --prerelease --latest=false --title "Feed de atualização (rc)" \
              --notes "Não instale daqui. É o feed da atualização automática das versões de teste (rc), sobrescrito a cada release (T1969). Os instaladores ficam nos releases de cada versão."
          fi
          gh release upload updates-rc out/*.tar.zst --repo "$GITHUB_REPOSITORY" --clobber
          gh release upload updates-rc out/*-update.json --repo "$GITHUB_REPOSITORY" --clobber
