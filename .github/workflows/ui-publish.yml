# A UI nova sem release (spec #25011, parte 2, T25030): assina as telas e sobrescreve o release `ui-channel`, de onde o
# app baixa a "Nova aparência pronta". Só a tela muda; o engine, o helper e as capacidades continuam no release.yml.
#
# - tag `ui-ANO.MÊS.N` (por exemplo `ui-2026.11.1`): publica no `ui-channel`, assinado com o segredo do repo
#   `UI_SIGNING_KEY` (Ed25519, gerada direto no segredo; a pública em app/src/bun/ui-keys.ts). Ninguém vê a chave;
# - "Run workflow" à mão: com rehearsal ligado (o padrão), assina com uma chave descartável e publica no
#   `ui-channel-rehearsal`, que nenhum app lê. Sem rehearsal, é como o tag.
#
# Recusa, sem publicar nada: um commit que não tem o último release `v*` (a tela voltaria para trás), uma UI de contrato
# mais novo que o do app publicado (só com release), um commit que não é mais novo que o da UI no canal, e uma chave
# fora do ui-keys.ts do app publicado. O app só aceita o endereço do release (T25028/T25029). Quem solta é o releaser, com a regra de ok
# do harry, como o release.

name: ui-publish

on:
  push:
    tags: ["ui-*"]
  workflow_dispatch:
    inputs:
      rehearsal:
        description: Ensaio (chave descartável, publica no ui-channel-rehearsal)
        type: boolean
        default: true

# Só leitura no build: o `bun install` roda scripts de dependência. Quem escreve é o job `publish`.
permissions:
  contents: read

# Uma publicação por vez: duas ao mesmo tempo leriam o mesmo manifesto anterior.
concurrency:
  group: ui-publish
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      release: ${{ steps.where.outputs.release }}
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # O histórico e os tags: o commit tem de conter o último release `v*`.
          fetch-depth: 0

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.4

      - name: Install
        run: bun install --frozen-lockfile

      # O devkit do AppEngine (o publish e a assinatura), como no typecheck do ci.yml: sem o Hutch, que só tem macOS.
      - name: Devkit
        timeout-minutes: 5
        run: for i in 1 2 3; do bun scripts/devkit-types.ts && exit 0; echo "devkit-types failed ($i of 3)"; [ "$i" -lt 3 ] && sleep 20; done; exit 1

      - name: Where
        id: where
        shell: bash
        env:
          REHEARSAL: ${{ github.event_name == 'workflow_dispatch' && inputs.rehearsal }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            [[ "$GITHUB_REF_NAME" =~ ^ui-[0-9]{4}\.[0-9]{1,2}\.[0-9]+$ ]] || { echo "the tag $GITHUB_REF_NAME must be ui-ANO.MÊS.N"; exit 1; }
          fi
          if [[ "$REHEARSAL" == "true" ]]; then echo "release=ui-channel-rehearsal" >> "$GITHUB_OUTPUT"; else echo "release=ui-channel" >> "$GITHUB_OUTPUT"; fi

      # O app publicado: o release "latest" (o que o app instalado tem). A UI vem de um commit que o contém, e o
      # contrato dela não passa o dele.
      - name: The published app
        id: app
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REHEARSAL: ${{ github.event_name == 'workflow_dispatch' && inputs.rehearsal }}
        run: |
          set -euo pipefail
          contract_at() { git show "$1:app/src/shared/ui-contract.ts" | sed -nE 's/^export const UI_CONTRACT_VERSION = "([0-9]+\.[0-9]+\.[0-9]+)";.*/\1/p'; }
          latest=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName 2>/dev/null || true)
          if [[ -z "$latest" && "$REHEARSAL" == "true" ]]; then
            # Um repo de ensaio sem release: o contrato do próprio commit.
            echo "no published app (rehearsal): using this commit's contract"
            contract=$(contract_at HEAD)
            cp src/bun/ui-keys.ts "$RUNNER_TEMP/app-ui-keys.ts"
          else
            [[ "$latest" == v* ]] || { echo "the latest release ($latest) isn't an app release v*"; exit 1; }
            git merge-base --is-ancestor "$latest" HEAD || { echo "this commit doesn't contain the published app $latest; the UI would go back"; exit 1; }
            contract=$(contract_at "$latest")
            # As chaves que o app publicado confia: uma chave nova só vale depois de um release com ela.
            git show "$latest:app/src/bun/ui-keys.ts" > "$RUNNER_TEMP/app-ui-keys.ts"
          fi
          [[ -n "$contract" ]] || { echo "no UI_CONTRACT_VERSION found"; exit 1; }
          echo "published app: ${latest:-(none)}, contract $contract"
          echo "contract=$contract" >> "$GITHUB_OUTPUT"
          echo "time=$(git log -1 --format=%ct HEAD)" >> "$GITHUB_OUTPUT"

      - name: Test
        run: bun test scripts/ui-channel-publish.test.ts

      - name: Build the UIs
        run: bun scripts/ui-build.ts

      # O segredo só neste passo. O script não imprime a chave, e recusa uma que não está no ui-keys.ts.
      - name: Sign
        env:
          UI_SIGNING_KEY: ${{ steps.where.outputs.release == 'ui-channel' && secrets.UI_SIGNING_KEY || '' }}
          BASE: https://github.com/${{ github.repository }}/releases/download/${{ steps.where.outputs.release }}
          REHEARSAL: ${{ steps.where.outputs.release == 'ui-channel-rehearsal' && '--rehearsal' || '' }}
        run: |
          set -euo pipefail
          bun scripts/ui-channel-publish.ts $REHEARSAL --out ../out --app-contract "${{ steps.app.outputs.contract }}" \
            --source-time "${{ steps.app.outputs.time }}" --base-url "$BASE" --previous-base "$BASE" \
            --app-keys "$RUNNER_TEMP/app-ui-keys.ts"
          ls -la ../out

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ui-channel
          path: out
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ui-channel
          path: out

      # Os packs sobem antes dos manifestos: quem lê um manifesto novo já acha o pack. Depois, saem os packs que nem o
      # manifesto novo nem o anterior apontam (um app no meio do download do anterior ainda o acha).
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE: ${{ needs.build.outputs.release }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          packs=(out/*.uipack); manifests=(out/*.manifest.json)
          [[ ${#packs[@]} -gt 0 && ${#manifests[@]} -gt 0 ]] || { echo "nothing to publish in out/"; ls -la out; exit 1; }
          if ! gh release view "$RELEASE" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release create "$RELEASE" --repo "$GITHUB_REPOSITORY" --prerelease --latest=false --title "Canal de UI ($RELEASE)" \
              --notes "Não instale daqui. É o canal da \"Nova aparência pronta\" (spec #25011): as telas assinadas que o Kiwi Notes baixa sem release, sobrescritas a cada publicação. O app fica nos releases de cada versão."
          fi
          mkdir -p prev
          gh release download "$RELEASE" --repo "$GITHUB_REPOSITORY" --pattern '*.manifest.json' --dir prev 2>/dev/null || true
          gh release upload "$RELEASE" "${packs[@]}" --repo "$GITHUB_REPOSITORY" --clobber
          gh release upload "$RELEASE" "${manifests[@]}" --repo "$GITHUB_REPOSITORY" --clobber
          keep=$(cat out/*.manifest.json prev/*.manifest.json 2>/dev/null | jq -r '.bundleUrl | split("/") | last' | sort -u)
          for asset in $(gh release view "$RELEASE" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name | select(endswith(".uipack"))'); do
            grep -qxF "$asset" <<< "$keep" || gh release delete-asset "$RELEASE" "$asset" --repo "$GITHUB_REPOSITORY" --yes
          done
          gh release view "$RELEASE" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[] | "\(.name) \(.size)"'
