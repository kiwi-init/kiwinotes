# CI dos PRs (T4928, L1, issue 152): `bun test`, `typecheck` e `swift test` em todo pull request e em todo push na
# `main`. Antes, só o release.yml rodava testes, e só num tag.
#
# Uma máquina macOS por PR, não três (spec #21331): o GitHub dá 5 ao mesmo tempo. O `typecheck` roda no Linux. O
# `bun test` e o `swift test` só pegam um Mac quando o PR mexe no que eles testam (o job `changes` decide, pelo
# scripts/ci-changes.ts); senão rodam no Linux, com um passo "pulado: <motivo>", e saem verdes. Sem filtro `paths` e
# sem `if:` no job: o check sumiria, ou sairia `skipped` sem passos. O scripts/merge-gate.ts aceita o pulado com motivo.
#
# Sem segredo e sem assinatura: nenhum job aqui lê as credenciais de release, e o token só lê o repo.
# O teste headless de WebKit (scripts/cli-ui.test.ts) roda aqui: o WebKit do Playwright em headless não precisa de tela.

name: ci

on:
  pull_request:
  push:
    branches: [main]

# O `bun install` roda scripts de dependência: nada aqui pode escrever no repo.
permissions:
  contents: read

# Num PR, um push novo cancela o run antigo. Na `main`, cada commit roda até o fim.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # O que o PR mexeu, em todos os commits dele e sem esconder renomeação (scripts/ci-changes.ts, changedFiles).
  changes:
    name: changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      bun: ${{ steps.plan.outputs.bun }}
      bun_reason: ${{ steps.plan.outputs.bun_reason }}
      swift: ${{ steps.plan.outputs.swift }}
      swift_reason: ${{ steps.plan.outputs.swift_reason }}
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.4

      # Fora de um PR (o push na `main`), a lista vai vazia e roda tudo.
      - name: plan
        id: plan
        env:
          EVENT: ${{ github.event_name }}
          RANGE: ${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}
        run: bun scripts/ci-changes.ts "$EVENT" --range "$RANGE"

  bun-test:
    name: bun test
    needs: changes
    runs-on: ${{ needs.changes.outputs.bun == 'run' && 'macos-latest' || 'ubuntu-latest' }}
    timeout-minutes: 30
    defaults:
      run:
        working-directory: app
    steps:
      # Quando o job roda, o passo aparece como "motivo do pulo", pulado, e o merge-gate o ignora.
      - name: "${{ needs.changes.outputs.bun == 'skip' && format('pulado: {0}', needs.changes.outputs.bun_reason) || 'motivo do pulo' }}"
        if: needs.changes.outputs.bun == 'skip'
        working-directory: .
        env:
          REASON: ${{ needs.changes.outputs.bun_reason }}
        run: 'echo "bun test pulado: $REASON"'

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # A guarda de privacidade lê cada commit do PR (spec #14415): precisa do histórico, não só da ponta.
          fetch-depth: 0

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.4

      # A guarda antes do GitHub (spec #14415), num PR: cada commit dele, e não só a árvore final, porque as refs dos PRs
      # guardam cada commit. Os padrões genéricos, o e-mail de autor e o OCR dos prints novos (o Vision do macOS).
      # Roda mesmo no PR só de texto, no Linux: ali não há imagem, e uma imagem nova sem OCR barra.
      # O mesmo roda no hook pre-push de cada máquina, antes de o push sair.
      - name: privacy (commits do PR)
        if: github.event_name == 'pull_request'
        env:
          RANGE: ${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}
        run: bun scripts/push-guard.ts --range "$RANGE"

      - name: Install
        if: needs.changes.outputs.bun == 'run'
        run: bun install --frozen-lockfile

      # A mesma chave do release.yml: o cache que a `main` guarda serve aos PRs.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: needs.changes.outputs.bun == 'run'
        with:
          path: ~/.hutch
          key: hutch-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('app/hutch-pin.json') }}

      # Sem o Hutch e o Livewire fixados, a `main` dá 20 testes falhando (#4866).
      - name: Electrobun toolchain
        if: needs.changes.outputs.bun == 'run'
        timeout-minutes: 5
        run: for i in 1 2 3; do bun run prepare:eb && exit 0; echo "electrobun prepare failed ($i of 3)"; [ "$i" -lt 3 ] && sleep 20; done; exit 1

      # Restaura aqui e grava logo depois de instalar (não no fim do job): um teste que falha não impede de guardar.
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: needs.changes.outputs.bun == 'run'
        id: playwright-cache
        with:
          path: ~/Library/Caches/ms-playwright
          # O v2 entrou com o chrome-headless-shell (issue 224): o cache antigo só tinha o WebKit.
          key: playwright-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('app/bun.lock') }}

      # O WebKit do Playwright, para os testes headless da UI (scripts/cli-ui.test.ts e o hub-tabs-ui-check), e o
      # chrome-headless-shell do notes-ui-check.
      - name: Browsers
        if: needs.changes.outputs.bun == 'run'
        id: browsers
        run: bunx playwright-core install webkit chromium-headless-shell

      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: needs.changes.outputs.bun == 'run' && steps.playwright-cache.outputs.cache-hit != 'true'
        with:
          path: ~/Library/Caches/ms-playwright
          key: ${{ steps.playwright-cache.outputs.cache-primary-key }}

      - name: bun test
        if: needs.changes.outputs.bun == 'run'
        run: bun test

      # Os roteiros de UI que o `bun test` não roda (issue 224): ficaram quebrando na `main` sem ninguém ver.
      # A janela Notas no Vite de dev com o vault de mentira, e as abas e a gota do hub no build real com um headless --no-helper.
      # Rodam mesmo com o `bun test` vermelho (um defeito não esconde o outro), mas só com os navegadores instalados.
      - name: notes-ui-check
        if: ${{ !cancelled() && needs.changes.outputs.bun == 'run' && steps.browsers.outcome == 'success' }}
        timeout-minutes: 10
        run: bun scripts/notes-ui-check.ts

      - name: hub-tabs-ui-check
        if: ${{ !cancelled() && needs.changes.outputs.bun == 'run' && steps.browsers.outcome == 'success' }}
        timeout-minutes: 10
        run: bun scripts/hub-tabs-ui-check.ts

      - name: hub-goo-check
        if: ${{ !cancelled() && needs.changes.outputs.bun == 'run' && steps.browsers.outcome == 'success' }}
        timeout-minutes: 10
        run: bun scripts/hub-goo-check.ts

  # No Linux (spec #21331): o devkit dos tipos sai do mesmo core fixado que o Hutch usa no Mac (scripts/devkit-types.ts,
  # e o devkit-types.test.ts confere no macOS que é igual).
  typecheck:
    name: typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.4

      - name: Install
        run: bun install --frozen-lockfile

      # O tsconfig estende o .hutch/devkit/tsconfig.json (25 erros sem ele, #4866).
      - name: Electrobun types
        timeout-minutes: 5
        run: for i in 1 2 3; do bun scripts/devkit-types.ts && exit 0; echo "devkit-types failed ($i of 3)"; [ "$i" -lt 3 ] && sleep 20; done; exit 1

      - name: typecheck
        run: bun run typecheck

      # Os links relativos do README, do AGENTS.md e dos docs (spec #13895): sem rede, só os arquivos do repo.
      - name: docs links
        run: bun scripts/docs-links-check.ts
      - name: privacy
        run: bun scripts/privacy-check.ts

  swift-test:
    name: swift test
    needs: changes
    runs-on: ${{ needs.changes.outputs.swift == 'run' && 'macos-latest' || 'ubuntu-latest' }}
    timeout-minutes: 20
    defaults:
      run:
        working-directory: native
    steps:
      # Quando o job roda, o passo aparece como "motivo do pulo", pulado, e o merge-gate o ignora.
      - name: "${{ needs.changes.outputs.swift == 'skip' && format('pulado: {0}', needs.changes.outputs.swift_reason) || 'motivo do pulo' }}"
        if: needs.changes.outputs.swift == 'skip'
        working-directory: .
        env:
          REASON: ${{ needs.changes.outputs.swift_reason }}
        run: 'echo "swift test pulado: $REASON"'

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: needs.changes.outputs.swift == 'run'
        with:
          persist-credentials: false

      - name: Toolchain
        if: needs.changes.outputs.swift == 'run'
        run: |
          xcodebuild -version
          swift --version

      # Compila só os testes. O `swift test` puro compila todos os alvos, e o kiwi-helper puxa o FluidAudio
      # (~8 min do zero, #1682). Nenhum alvo de teste depende dele, então este build leva ~20 s e não precisa de cache.
      - name: Build the tests
        if: needs.changes.outputs.swift == 'run'
        run: swift build --product KiwiHelperPackageTests

      - name: swift test
        if: needs.changes.outputs.swift == 'run'
        run: swift test --skip-build
